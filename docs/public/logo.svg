<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Ring -->
  <circle cx="100" cy="100" r="90" fill="#0b0f19" stroke="url(#grad1)" stroke-width="3" opacity="0.9" />
  <circle cx="100" cy="100" r="75" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,4" />
  
  <!-- Network Nodes & Connecting Arcs -->
  <path d="M 50 120 Q 100 40 150 120" fill="none" stroke="url(#grad2)" stroke-width="3" />
  <path d="M 40 90 Q 100 150 160 90" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Supersonic Jet / Fun Rocket Motif -->
  <path d="M 100 45 L 125 110 L 100 95 L 75 110 Z" fill="url(#grad1)" filter="url(#glow)" />
  <circle cx="100" cy="95" r="4" fill="#ffffff" />

  <!-- Data Pulse Dots -->
  <circle cx="50" cy="120" r="5" fill="#38bdf8" />
  <circle cx="150" cy="120" r="5" fill="#10b981" />
  <circle cx="100" cy="155" r="4" fill="#38bdf8" opacity="0.8" />
</svg>
